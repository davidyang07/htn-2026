services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: agentnet_dev
      POSTGRES_DB: agentnet
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentnet"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: agentnet_dev
      POSTGRES_DB: agentnet
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      # M0's experiment/stream traffic goes browser -> backend directly, so
      # these must resolve from the host (not the "backend" Compose hostname).
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pg_data:
